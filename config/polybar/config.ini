[colors]
bg = #1a1b26
bg-alt = #24283b
fg = #a9b1d6
fg-alt = #7c84a6
blue = #7aa2f7
cyan = #7dcfff
green = #9ece6a
orange = #ff9e64
purple = #bb9af7
red = #f7768e
yellow = #e0af68

[bar/main]
monitor = HDMI-0
pin-workspaces = true
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
line-color = ${colors.bg-alt}

border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=10:2
font-1 = JetBrainsMono Nerd Font:size=10:2
font-2 = FontAwesome:size=10:2

modules-left = i3
modules-center = 
modules-right = filesystem pulseaudio xkeyboard network memory cpu calendar

cursor-click = pointer
cursor-scroll = pointer

enable-ipc = true

warn-ring-interval = 5

[bar/second]
monitor = DP-0
pin-workspaces = true
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
line-color = ${colors.bg-alt}

border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=10:2
font-1 = JetBrainsMono Nerd Font:size=10:2
font-2 = FontAwesome:size=10:2

modules-left = i3
modules-center = 
modules-right = filesystem pulseaudio xkeyboard network memory cpu calendar

cursor-click = pointer
cursor-scroll = pointer

enable-ipc = true

warn-ring-interval = 5

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = ${colors.bg-alt}
label-focused-foreground = ${colors.blue}
label-focused-underline = ${colors.blue}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-alt}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

label-separator = 
label-separator-foreground = ${colors.fg-alt}

[module/filesystem]
type = internal/fs
mount-0 = /
label-mounted = DISK %free%
label-unmounted = DISK UNKNOWN
label-unmounted-foreground = ${colors.red}
label-mounted-foreground = ${colors.cyan}
label-mounted-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-foreground = ${colors.purple}
label-volume = VOL %percentage%%
label-volume-padding = 2

format-muted = <label-muted>
format-muted-foreground = ${colors.red}
label-muted = VOL muted
label-muted-padding = 2

[module/network]
type = internal/network
interface = enp5s0
format-connected = <label-connected>
label-connected = NET %local_ip%
label-connected-foreground = ${colors.cyan}
label-connected-padding = 2

format-disconnected = <label-disconnected>
label-disconnected = NET DOWN
label-disconnected-foreground = ${colors.red}
label-disconnected-padding = 2

interval = 5

[module/memory]
type = internal/memory
format = <label>
label = RAM %percentage_used%%
label-foreground = ${colors.cyan}
label-padding = 2

[module/cpu]
type = internal/cpu
format = <label>
label = CPU %percentage:2%%
label-foreground = ${colors.orange}
label-padding = 2

[module/calendar]
type = custom/script
exec = ~/.config/polybar/scripts/calendar.sh
interval = 1
click-left = ~/.config/polybar/scripts/calendar.sh --popup
format-foreground = ${colors.blue}
format-padding = 2
