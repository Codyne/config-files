# Tokyo Night picom config

backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.3;
shadow-color = "#000000";
shadow-exclude = [
    "class_i = 'polybar'",
    "class_i = 'rofi'",
    "name = 'Notification'",
    "name = 'cpt_frame'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 2;

# Opacity
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Opacity overrides
opacity-rule = [
    "90:class_i = 'URxvt' && !_NET_WM_STATE@:32a",
    "95:class_g = 'Alacritty' && !_NET_WM_STATE@:32a",
    "95:class_g = 'kitty' && !_NET_WM_STATE@:32a"
];

# Blur
blur-method = "dual_kawase";
blur-size = 8;
blur-strength = 4;
blur-deviation = false;

blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;
blur-kern = "3x3box";

blur-background-exclude = [
    "class_i = 'polybar'",
    "class_i = 'rofi'"
];

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.85; focus = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.9; };
    dropdown_menu = { opacity = 0.9; };
};

# Corners
corner-radius = 0;
rounded-corners-exclude = [
    "class_i = 'polybar'"
];
